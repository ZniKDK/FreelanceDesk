[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freelancedesk"
version = "0.5.1"
description = "Десктоп-приложение для учёта заказов фрилансера"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZniKDK" }]
dependencies = [
    "PyQt6>=6.6",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
freelancedesk = "freelancedesk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
