; Образец настроек FreelanceDesk.
;
; Программа читает настройки из %APPDATA%\FreelanceDesk\config.ini
; и создаёт этот файл сама при первом запуске (с SQLite).
; Образец нужен, чтобы переключиться на PostgreSQL.
;
; Файл config/config.ini в папке проекта используется только тестами
; (подключение к базе freelancedesk_test) и не попадает в Git.

[storage]
; sqlite или postgresql
backend = postgresql

[sqlite]
; Пусто — freelancedesk.db рядом с config.ini
path =

[database]
host = localhost
port = 5432
name = freelancedesk
user = freelancedesk
password = change_me
